name: CI

on:
  push:
    branches: [main]
  # No branch filter: a stacked PR targets its parent branch rather than
  # main, and must still be checked before it merges.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type check, lint, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # --ignore-scripts skips dependency lifecycle scripts; puppeteer's
      # postinstall downloads a Chromium build the test suite never uses.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # src/buildInfo.ts is gitignored and generated at build time, but
      # tsc needs it to resolve the import in desktop/layout.ts.
      - name: Generate build info
        run: node scripts/generate-build-info.cjs

      - name: Type check
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          # Coverage reporting should not gate the merge — the checks above do.
          fail_ci_if_error: false
