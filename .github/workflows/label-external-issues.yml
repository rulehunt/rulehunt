name: Label external issues

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  label_external:
    runs-on: ubuntu-latest

    steps:
      - name: Check if author is a collaborator
        id: check
        uses: actions/github-script@v9
        with:
          # Returns the string "true" or "false". A plain boolean keeps the
          # downstream `if:` a simple comparison rather than a fromJSON hop.
          result-encoding: string
          script: |
            const { owner, repo } = context.repo
            const username = context.payload.issue.user.login
            try {
              await github.rest.repos.checkCollaborator({ owner, repo, username })
              core.info(`${username} is a collaborator`)
              return 'true'
            } catch {
              core.info(`${username} is not a collaborator`)
              return 'false'
            }

      - name: Add 'external' label
        if: steps.check.outputs.result == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['external'],
            })

      - name: Post welcome comment
        if: steps.check.outputs.result == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            // Built by joining lines rather than with a template literal: a
            // multi-line literal has to stay indented inside this block
            // scalar, and that indentation would show up in the comment.
            const body = [
              'Thank you for submitting an issue! 🙏',
              '',
              'This issue has been automatically labeled as `external` and will be reviewed by the maintainers.',
              '',
              '**Note**: External issues require manual triage before being assigned. We appreciate your patience while we review your submission.',
              '',
              'For questions or discussions, please use [GitHub Discussions](https://github.com/rulehunt/rulehunt/discussions).',
            ].join('\n')

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
